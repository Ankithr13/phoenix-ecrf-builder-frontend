# Alembic configuration. The database URL is not set here on purpose:
# migrations/env.py reads it from ecrf.config, so DATABASE_URL decides the
# target exactly as it does for the app. Run from this directory:
#
#   alembic upgrade head        apply every migration
#   alembic current             show the applied revision
#   alembic revision -m "..."   start a new migration file
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
